<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F4F0EB"/>
    </linearGradient>
    <style>
      .brand { font-family: 'Fraunces', Georgia, serif; font-weight: 700; }
      .body { font-family: 'DM Sans', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtile Linie oben -->
  <rect x="80" y="80" width="60" height="3" fill="#7A6B5D" rx="1"/>

  <!-- Eyebrow -->
  <text x="80" y="140" class="body" font-size="20" font-weight="600" fill="#7A6B5D" letter-spacing="2">
    VORSORGE · TRAUER · BESTATTUNG
  </text>

  <!-- Brand Headline -->
  <text x="80" y="280" class="brand" font-size="92" fill="#2D2319">
    Wenn es soweit ist.
  </text>
  <text x="80" y="380" class="brand" font-size="92" fill="#7A6B5D">
    Mach's ruhig.
  </text>

  <!-- Subline -->
  <text x="80" y="460" class="body" font-size="26" fill="#73655A">
    Schritt für Schritt, in deinem Tempo.
  </text>
  <text x="80" y="498" class="body" font-size="26" fill="#73655A">
    Nur was du brauchst, wenn du es brauchst.
  </text>

  <!-- Domain unten -->
  <text x="80" y="580" class="body" font-size="22" font-weight="600" fill="#2D2319">
    machsruhig.de
  </text>

  <!-- Subtile Akzentlinie unten rechts -->
  <rect x="1060" y="547" width="60" height="3" fill="#7A6B5D" rx="1"/>
</svg>
