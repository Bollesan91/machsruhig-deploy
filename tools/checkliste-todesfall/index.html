      h += '<details style="border:1px solid var(--mr-border);border-radius:8px;margin-bottom:8px;background:var(--mr-bg-card)">';
      h += '<summary style="padding:16px 20px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center">' + esc(f.q) + '</summary>';
      h += '<div style="padding:0 20px 16px;font-size:14px;line-height:1.7;color:var(--mr-text-muted)"><p>' + esc(f.a) + '</p></div>';
      h += '</details>';
    });
    h += '</section>';

    // Quellen
    h += '<div style="background:#f4f0eb;border-radius:var(--mr-radius);padding:24px 28px;margin:40px 0">';
    h += '<h2 style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;margin-bottom:12px">Quellen</h2>';
    h += '<ul style="list-style:none">';
    ['Jeweiliges Landesbestattungsgesetz des Bundeslandes (Stand: April 2026)',
     'Personenstandsgesetz (PStG) §28 — Anzeigepflicht beim Standesamt',
     'Bürgerliches Gesetzbuch (BGB) §580 — Sonderkündigungsrecht bei Tod',
     'Sozialgesetzbuch XII §74 — Bestattungskosten bei Bedürftigkeit'].forEach(function(q){
      h += '<li style="font-size:13px;color:var(--mr-text-muted);padding:4px 0 4px 16px;position:relative"><span style="position:absolute;left:0;color:var(--mr-warm)">→</span>' + esc(q) + '</li>';
    });
    h += '</ul></div>';

    // Disclaimer
    h += '<div style="text-align:center;padding:24px 0;margin-bottom:16px">';
    h += '<p style="font-size:13px;color:var(--mr-text-muted);line-height:1.6">Alle Angaben ohne Gewähr. Bestattungsrecht ist Ländersache. Diese Checkliste ersetzt keine Rechtsberatung.<br>';
    h += 'machsruhig.de ist ein unabhängiges Informationsportal. <a href="/methodik" style="color:var(--mr-primary);text-decoration:none">Mehr zu unserer Methodik</a>.</p>';
    h += '</div>';

    var v = $('#view-checklist');
    v.innerHTML = h;

    // Bind actions
    $('#cl-print-btn').addEventListener('click', function(){
      track('toolExport', {tool:'checkliste-todesfall', type:'print'});
      window.print();
    });
    $('#cl-restart-btn').addEventListener('click', function(){
      state.checkedTasks = {};
      $('#view-checklist').classList.remove('active');
      $('#view-setup').classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    $$('.task-cb').forEach(function(cb){
      cb.addEventListener('change', function(){ toggleTask(cb.dataset.task); });
    });
    $$('.task-share').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.task;
        var t = null;
        PHASEN.forEach(function(p){ p.aufgaben.forEach(function(x){ if(x.id===id) t = x; }); });
        if (t) shareWhatsapp(t.titel, t.desc);
      });
    });
  }
})();
</script>

</body>
</html>
